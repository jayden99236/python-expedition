<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
<title>Python Expedition — Learn Python by Playing</title>
<style>
  :root{
    --ink:#0c1a16;
    --panel:#12241e;
    --panel-2:#0f1f1a;
    --line:#1e3a30;
    --text:#eae4d2;
    --text-dim:#9fae9f;
    --gold:#f2b33d;
    --gold-dim:#b98a2e;
    --leaf:#4fbf8b;
    --ember:#e0645c;
    --mono:ui-monospace,"Cascadia Code","Source Code Pro",Menlo,Consolas,"Liberation Mono",monospace;
    --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--body);
    font-size:16px;
    line-height:1.55;
    min-height:100vh;
  }
  ::selection{background:var(--gold);color:var(--ink)}

  /* ---------- header ---------- */
  header.top{
    display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;
    padding:.9rem 1.4rem;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0e1e19,var(--ink));
    position:sticky;top:0;z-index:10;
  }
  .logo{
    font-family:var(--mono);
    font-size:1.02rem;font-weight:700;letter-spacing:.22em;
    color:var(--gold);white-space:nowrap;
  }
  .logo .snake{color:var(--leaf)}
  .hud{display:flex;align-items:center;gap:.9rem;margin-left:auto;flex-wrap:wrap}
  .rank{
    font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink);background:var(--gold);
    padding:.28rem .6rem;border-radius:2px;font-weight:700;white-space:nowrap;
  }
  .xpwrap{display:flex;align-items:center;gap:.55rem}
  .xpbar{width:150px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .xpbar>div{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));width:0%;transition:width .5s ease}
  .xpnum{font-family:var(--mono);font-size:.78rem;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  button.sound{
    font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;
    background:none;color:var(--text-dim);
    border:1px solid var(--line);border-radius:3px;
    padding:.28rem .5rem;cursor:pointer;white-space:nowrap;
  }
  button.sound:hover{color:var(--text);border-color:var(--text-dim)}
  button.sound:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  button.sound[aria-pressed="true"]{color:#5c6b5f}

  /* ---------- layout ---------- */
  .shell{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 58px)}
  @media (max-width:860px){.shell{grid-template-columns:1fr}}

  /* ---------- map rail ---------- */
  nav.map{
    border-right:1px solid var(--line);
    background:var(--panel-2);
    padding:1.2rem .9rem 2rem;
  }
  @media (max-width:860px){nav.map{border-right:none;border-bottom:1px solid var(--line)}}
  .map h2{
    font-family:var(--mono);font-size:.68rem;font-weight:600;
    letter-spacing:.24em;text-transform:uppercase;color:var(--text-dim);
    margin:1.3rem 0 .45rem .5rem;
  }
  .map h2:first-child{margin-top:0}
  .lvl{
    display:flex;align-items:center;gap:.6rem;width:100%;
    background:none;border:1px solid transparent;border-radius:4px;
    color:var(--text);font:inherit;font-size:.9rem;
    padding:.42rem .5rem;cursor:pointer;text-align:left;
  }
  .lvl:hover:not(:disabled){background:var(--panel);border-color:var(--line)}
  .lvl.active{background:var(--panel);border-color:var(--gold-dim)}
  .lvl:disabled{color:#5c6b5f;cursor:not-allowed}
  .lvl .node{
    font-family:var(--mono);font-size:.68rem;font-weight:700;
    width:1.7rem;height:1.7rem;flex:none;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--line);color:var(--text-dim);
    font-variant-numeric:tabular-nums;
  }
  .lvl.done .node{background:var(--leaf);border-color:var(--leaf);color:var(--ink)}
  .lvl.active .node{border-color:var(--gold);color:var(--gold)}
  .lvl:disabled .node{border-color:#2a3a31;color:#4a584d}
  .lvl .xpchip{margin-left:auto;font-family:var(--mono);font-size:.66rem;color:var(--gold-dim);font-variant-numeric:tabular-nums}
  .mapfoot{margin-top:2rem;padding:0 .5rem}
  .mapfoot button{
    background:none;border:none;color:#5c6b5f;font:inherit;font-size:.75rem;
    cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;
  }
  .mapfoot button:hover{color:var(--ember)}

  /* ---------- pet companion ---------- */
  .pet{
    border:1px solid var(--line);border-radius:8px;background:var(--panel);
    padding:.7rem .8rem .6rem;margin:0 .1rem 1.2rem;
  }
  .pet-top{display:flex;align-items:baseline;gap:.45rem;flex-wrap:wrap}
  .pet-name{font-family:var(--mono);font-weight:700;font-size:.9rem;color:var(--gold)}
  .pet-rename{background:none;border:none;color:#5c6b5f;cursor:pointer;font-family:var(--mono);font-size:.68rem;padding:0}
  .pet-rename:hover{color:var(--text)}
  .pet-stage{margin-left:auto;font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf)}
  .pet-art{margin:.35rem 0 .2rem}
  .pet-art svg{display:block;width:100%;height:auto}
  .pet-meta{font-family:var(--mono);font-size:.65rem;color:var(--text-dim);font-variant-numeric:tabular-nums;line-height:1.5}

  /* ---------- main ---------- */
  main{padding:1.6rem 1.8rem 4rem;max-width:880px}
  @media (max-width:860px){main{padding:1.2rem 1rem 3rem}}
  .eyebrow{
    font-family:var(--mono);font-size:.7rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--gold);margin:0 0 .35rem;
  }
  h1.title{
    font-family:var(--mono);font-weight:700;
    font-size:clamp(1.5rem,3.4vw,2.1rem);
    letter-spacing:.02em;margin:0 0 1rem;text-wrap:balance;
  }
  .brief{max-width:62ch;color:var(--text)}
  .brief p{margin:.65rem 0}
  .brief code{
    font-family:var(--mono);font-size:.86em;
    background:var(--panel);border:1px solid var(--line);
    padding:.1em .35em;border-radius:3px;color:var(--gold);
  }
  .brief pre{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:.8rem 1rem;overflow-x:auto;margin:.8rem 0;
  }
  .brief pre code{background:none;border:none;padding:0;color:var(--text);font-size:.85rem;line-height:1.6}
  .goal{
    border-left:3px solid var(--gold);
    background:var(--panel);
    padding:.7rem 1rem;margin:1.1rem 0;
    border-radius:0 6px 6px 0;
    max-width:62ch;
  }
  .goal .goal-label{
    font-family:var(--mono);font-size:.66rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--gold);display:block;margin-bottom:.25rem;
  }

  /* ---------- editor ---------- */
  .bench{margin-top:1.4rem}
  .bench-label{
    font-family:var(--mono);font-size:.66rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--text-dim);margin-bottom:.4rem;
    display:flex;align-items:center;gap:.6rem;
  }
  .bench-label .dotrow{display:inline-flex;gap:5px}
  .bench-label .dotrow i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
  textarea.editor{
    width:100%;min-height:220px;resize:vertical;
    background:#0a1512;color:var(--text);
    font-family:var(--mono);font-size:.92rem;line-height:1.65;
    border:1px solid var(--line);border-radius:6px;
    padding:.9rem 1rem;
    tab-size:4;
  }
  textarea.editor:focus{outline:2px solid var(--gold-dim);outline-offset:1px;border-color:var(--gold-dim)}
  .btnrow{display:flex;gap:.6rem;margin-top:.7rem;flex-wrap:wrap;align-items:center}
  button.run{
    font-family:var(--mono);font-weight:700;font-size:.85rem;letter-spacing:.1em;
    background:var(--gold);color:var(--ink);
    border:none;border-radius:4px;padding:.6rem 1.4rem;cursor:pointer;
  }
  button.run:hover{background:#ffc75a}
  button.run:focus-visible,button.ghost:focus-visible,.lvl:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  button.ghost{
    font-family:var(--mono);font-size:.8rem;letter-spacing:.08em;
    background:none;color:var(--text-dim);
    border:1px solid var(--line);border-radius:4px;padding:.55rem 1rem;cursor:pointer;
  }
  button.ghost:hover{color:var(--text);border-color:var(--text-dim)}
  .kbd-hint{font-family:var(--mono);font-size:.7rem;color:#5c6b5f;margin-left:auto}

  /* ---------- console ---------- */
  .console{
    margin-top:1rem;background:#0a1512;
    border:1px solid var(--line);border-radius:6px;
    font-family:var(--mono);font-size:.88rem;line-height:1.6;
    padding:.8rem 1rem;min-height:3.2rem;white-space:pre-wrap;
    overflow-x:auto;
  }
  .console .muted{color:#5c6b5f}
  .console .err{color:var(--ember)}
  .console .exp{color:var(--text-dim)}
  .banner{
    margin-top:1rem;border-radius:6px;padding:.85rem 1.1rem;
    display:none;align-items:baseline;gap:.7rem;flex-wrap:wrap;
  }
  .banner.show{display:flex}
  .banner.win{background:rgba(79,191,139,.12);border:1px solid var(--leaf)}
  .banner.win .headline{color:var(--leaf);font-family:var(--mono);font-weight:700}
  .banner.lose{background:rgba(224,100,92,.09);border:1px solid rgba(224,100,92,.5)}
  .banner.lose .headline{color:var(--ember);font-family:var(--mono);font-weight:700}
  .banner .next{
    margin-left:auto;font-family:var(--mono);font-weight:700;font-size:.82rem;
    background:var(--leaf);color:var(--ink);border:none;border-radius:4px;
    padding:.45rem 1rem;cursor:pointer;
  }
  .banner .next:hover{filter:brightness(1.1)}
  @media (prefers-reduced-motion:no-preference){
    .banner.win.show{animation:rise .35s ease}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
  .hintbox{
    margin-top:.9rem;border:1px dashed var(--line);border-radius:6px;
    padding:.7rem 1rem;color:var(--text-dim);max-width:62ch;display:none;
  }
  .hintbox.show{display:block}
  .hintbox b{color:var(--gold);font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
  .hintbox code{font-family:var(--mono);color:var(--gold);font-size:.85em}

  /* ---------- hero ---------- */
  .hero{max-width:640px;margin:3rem auto 0;text-align:left;padding:0 .5rem}
  .hero .eyebrow{margin-bottom:.6rem}
  .hero h1{
    font-family:var(--mono);font-weight:700;line-height:1.15;
    font-size:clamp(2rem,6vw,3.2rem);margin:0 0 1.1rem;letter-spacing:.01em;text-wrap:balance;
  }
  .hero h1 .cursor{display:inline-block;width:.55em;height:1em;background:var(--gold);vertical-align:-.12em;margin-left:.08em}
  @media (prefers-reduced-motion:no-preference){
    .hero h1 .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  }
  .hero p{color:var(--text-dim);max-width:52ch;font-size:1.05rem}
  .hero .creds{
    font-family:var(--mono);font-size:.78rem;color:var(--text-dim);
    border:1px solid var(--line);border-radius:6px;background:var(--panel);
    padding:.9rem 1.1rem;margin:1.5rem 0;line-height:2;
  }
  .hero .creds .g{color:var(--leaf)}
  .hero .creds .y{color:var(--gold)}
  .hero button.run{font-size:.95rem;padding:.75rem 1.8rem;margin-top:.4rem}

  .finish{max-width:60ch}
  .finish .bigrank{
    font-family:var(--mono);font-weight:700;font-size:clamp(1.6rem,4vw,2.4rem);
    color:var(--gold);margin:.6rem 0 1rem;
  }
</style>
</head>
<body>
<header class="top">
  <div class="logo"><span class="snake">&gt;&gt;&gt;</span> PYTHON EXPEDITION</div>
  <div class="hud">
    <span class="rank" id="rank">HATCHLING</span>
    <span class="xpwrap">
      <span class="xpbar"><div id="xpfill"></div></span>
      <span class="xpnum" id="xpnum">0 / 450 XP</span>
    </span>
    <button class="sound" id="soundbtn" aria-pressed="false">SOUND ON</button>
  </div>
</header>

<div class="shell">
  <nav class="map" id="map" aria-label="Expedition map"></nav>
  <main id="main"></main>
</div>

<script>
'use strict';
/* =====================================================================
   PART 1 — A miniature Python interpreter (real lexer/parser/evaluator)
   Supports: print (sep/end), variables, int/float, strings & f-strings
   (with format specs like {x:.2f} and {name:<10}), arithmetic, chained
   comparisons, and/or/not, in/not in/is, if/elif/else, conditional
   expressions, while, for (with tuple unpacking), break/continue/pass,
   lists, tuples, dicts, slicing, list/dict comprehensions, def (default and
   keyword arguments), lambda, recursion, try/except/else/finally, raise,
   classes with __init__/__str__/methods/inheritance, del, and the common
   built-ins and str/list/dict methods. Brackets may span several lines.
   ===================================================================== */

class PyError extends Error{
  constructor(kind,msg,line,fatal){super(msg);this.kind=kind;this.pyline=line;this.fatal=!!fatal;}
}
class PyNum{constructor(v,isFloat){this.v=v;this.isFloat=!!isFloat;}}
class PyTuple{constructor(items){this.items=items;}}
class PyView{constructor(kind,items){this.kind=kind;this.items=items;}}
class PyDict{
  constructor(){this.m=new Map();}
  get size(){return this.m.size;}
  has(k){return this.m.has(hashKey(k));}
  get(k){const e=this.m.get(hashKey(k));return e?e[1]:undefined;}
  set(k,v){const h=hashKey(k);const e=this.m.get(h);if(e)e[1]=v;else this.m.set(h,[k,v]);}
  del(k){return this.m.delete(hashKey(k));}
  keys(){return [...this.m.values()].map(e=>e[0]);}
  values(){return [...this.m.values()].map(e=>e[1]);}
  entries(){return [...this.m.values()];}
}
const PyNone = Symbol('None');
class BreakSig{} class ContinueSig{} class ReturnSig{constructor(v){this.v=v;}}
let CUR=null; // the interpreter currently running (lets __str__ hooks run from pyStr)

const KEYWORDS = new Set(['if','elif','else','while','for','in','def','return',
  'break','continue','pass','and','or','not','True','False','None',
  'try','except','finally','raise','class','as','is','del','lambda']);
const THREE_OPS = ['//=','**='];
const TWO_OPS = ['**','//','==','!=','<=','>=','+=','-=','*=','/=','%='];
const ONE_OPS = '+-*/%()[]{},:.<>=';
const AUG_OPS = ['+=','-=','*=','/=','//=','%=','**='];

function decodeEscapes(s){
  let out='';
  for(let i=0;i<s.length;i++){
    if(s[i]==='\\'){
      const n=s[i+1];
      if(n==='n'){out+='\n';i++;}
      else if(n==='t'){out+='\t';i++;}
      else if(n==='\\'){out+='\\';i++;}
      else if(n==="'"){out+="'";i++;}
      else if(n==='"'){out+='"';i++;}
      else out+='\\';
    } else out+=s[i];
  }
  return out;
}

function lex(src){
  const lines = src.replace(/\r\n?/g,'\n').split('\n');
  const toks=[]; const indents=[0];
  let depth=0, joined=false, openLine=0;
  for(let li=0; li<lines.length; li++){
    const raw = lines[li];
    const ln = li+1;
    const ws = raw.match(/^[ \t]*/)[0];
    const rest = raw.slice(ws.length);
    if(depth===0 && !joined){
      if(rest==='' || rest.startsWith('#')) continue;
      const indent = ws.replace(/\t/g,'    ').length;
      if(indent > indents[indents.length-1]){
        indents.push(indent); toks.push({t:'INDENT',line:ln});
      } else {
        while(indent < indents[indents.length-1]){ indents.pop(); toks.push({t:'DEDENT',line:ln}); }
        if(indent !== indents[indents.length-1])
          throw new PyError('IndentationError','unindent does not match any outer indentation level',ln);
      }
    }
    joined=false;
    let i=0;
    while(i<rest.length){
      const c=rest[i];
      if(c===' '||c==='\t'){i++;continue;}
      if(c==='#') break;
      if(c==='\\' && rest.slice(i+1).trim()===''){joined=true;break;}
      // f-string
      if((c==='f'||c==='F') && (rest[i+1]==='"'||rest[i+1]==="'")){
        const q=rest[i+1]; let j=i+2; let body='';
        while(j<rest.length && rest[j]!==q){
          if(rest[j]==='\\'){body+=rest[j]+ (rest[j+1]||''); j+=2;}
          else {body+=rest[j]; j++;}
        }
        if(j>=rest.length) throw new PyError('SyntaxError','unterminated string literal',ln);
        toks.push({t:'FSTR',v:body,line:ln}); i=j+1; continue;
      }
      // string
      if(c==='"'||c==="'"){
        let j=i+1; let body='';
        while(j<rest.length && rest[j]!==c){
          if(rest[j]==='\\'){body+=rest[j]+(rest[j+1]||''); j+=2;}
          else {body+=rest[j]; j++;}
        }
        if(j>=rest.length) throw new PyError('SyntaxError','unterminated string literal',ln);
        toks.push({t:'STR',v:decodeEscapes(body),line:ln}); i=j+1; continue;
      }
      // number
      if(/[0-9]/.test(c) || (c==='.' && /[0-9]/.test(rest[i+1]||''))){
        let j=i; let sawDot=false;
        while(j<rest.length && (/[0-9_]/.test(rest[j]) || (rest[j]==='.' && !sawDot))){
          if(rest[j]==='.') sawDot=true; j++;
        }
        const ex=rest.slice(j).match(/^[eE][+-]?[0-9]+/);
        if(ex){j+=ex[0].length;sawDot=true;}
        toks.push({t:'NUM',v:parseFloat(rest.slice(i,j).replace(/_/g,'')),f:sawDot,line:ln}); i=j; continue;
      }
      // name / keyword
      if(/[A-Za-z_]/.test(c)){
        let j=i; while(j<rest.length && /[A-Za-z0-9_]/.test(rest[j])) j++;
        const w=rest.slice(i,j);
        toks.push({t:KEYWORDS.has(w)?'KW':'NAME',v:w,line:ln}); i=j; continue;
      }
      const three=rest.slice(i,i+3);
      if(THREE_OPS.includes(three)){toks.push({t:'OP',v:three,line:ln}); i+=3; continue;}
      const two=rest.slice(i,i+2);
      if(TWO_OPS.includes(two)){toks.push({t:'OP',v:two,line:ln}); i+=2; continue;}
      if(ONE_OPS.includes(c)){
        if('([{'.includes(c)){if(depth===0)openLine=ln;depth++;}
        else if(')]}'.includes(c)){
          if(depth===0)throw new PyError('SyntaxError',`unmatched '${c}'`,ln);
          depth--;
        }
        toks.push({t:'OP',v:c,line:ln}); i++; continue;
      }
      if(c==='!')throw new PyError('SyntaxError',"invalid character '!' — Python writes \"not equal\" as != and \"not\" as the word not",ln);
      throw new PyError('SyntaxError',`invalid character '${c}'`,ln);
    }
    if(depth===0 && !joined) toks.push({t:'NEWLINE',line:ln});
  }
  if(depth>0) throw new PyError('SyntaxError','a bracket was opened here but never closed',openLine);
  if(toks.length && toks[toks.length-1].t!=='NEWLINE' && toks[toks.length-1].t!=='DEDENT')
    toks.push({t:'NEWLINE',line:lines.length});
  while(indents.length>1){indents.pop();toks.push({t:'DEDENT',line:lines.length});}
  toks.push({t:'EOF',line:lines.length});
  return toks;
}

function validTarget(t){
  if(t.k==='name'||t.k==='index'||t.k==='attr')return true;
  if(t.k==='tuple'||t.k==='list')return t.items.every(validTarget);
  return false;
}

class Parser{
  constructor(toks){this.toks=toks;this.pos=0;}
  peek(o){return this.toks[this.pos+(o||0)]||{t:'EOF',line:0};}
  next(){return this.toks[this.pos++];}
  at(t,v){const k=this.peek();return k.t===t && (v===undefined || k.v===v);}
  eat(t,v){if(this.at(t,v))return this.next();return null;}
  expect(t,v,what){
    const k=this.peek();
    if(k.t===t && (v===undefined||k.v===v)) return this.next();
    const got=k.t==='EOF'?'the end of the code':k.t==='NEWLINE'?'the end of the line':k.t==='INDENT'?'an unexpected indent':`'${k.v}'`;
    throw new PyError(k.t==='INDENT'?'IndentationError':'SyntaxError',`expected ${what||`'${v}'`||t}, but found ${got}`,k.line);
  }
  parseProgram(){
    const body=[];
    while(!this.at('EOF')){
      if(this.eat('NEWLINE')) continue;
      if(this.at('INDENT'))throw new PyError('IndentationError','unexpected indent',this.peek().line);
      body.push(this.parseStmt());
    }
    return {k:'block',body};
  }
  parseBlock(){
    // after ':' — either NEWLINE INDENT ... DEDENT, or one inline simple stmt
    if(this.eat('NEWLINE')){
      if(!this.at('INDENT'))
        throw new PyError('IndentationError','expected an indented block',this.peek().line);
      this.next();
      const body=[];
      while(!this.at('DEDENT') && !this.at('EOF')){

function parseExprSrc(src,line){

function runPython(src){
  const interp=new Interp();
  const done=error=>({out:interp.out,error});
  try{
    interp.run(src);
    return done(null);
  }catch(e){
    if(e instanceof PyError){
      const ln=e.pyline||interp.line;
      return done(`${e.kind}: ${e.message}`+(ln?` (line ${ln})`:''));
    }
    if(e instanceof BreakSig||e instanceof ContinueSig)return done("SyntaxError: 'break' and 'continue' only work inside a loop");
    if(e instanceof ReturnSig)return done("SyntaxError: 'return' only works inside a function");
    if(e instanceof RangeError)return done('RecursionError: maximum recursion depth exceeded — does your recursive function have a base case?');
    return done('InternalError: '+e.message);
  }
}

  id:'13-3',ch:12,xp:38,title:'The spiral stair',

{
  id:'15-3',ch:14,xp:42,title:'Raising the alarm',
  brief:`<p>Sometimes <em>your</em> code should be the one to cry out. <code>raise</code> throws an error on purpose, with a message. Whoever calls the function can catch it — and <code>except ValueError as e</code> gives you the error itself, so you can print its message:</p>

Stay ashore: wind too strong: 55</code></pre>`,
  starter:'def set_sail(wind):\n    # raise if the wind is above 40\n    return "sailing"\n\nfor wind in [12, 55]:\n    # try to sail, catch the alarm\n    print(set_sail(wind))\n',

  require:[{re:/raise\s+ValueError\s*\(/,msg:'Raise the alarm with raise ValueError(...).'},
           {re:/except\s+ValueError\s+as\s+\w+/,msg:'Catch it with except ValueError as e: so you can print the message.'}],
  hints:['In the function: if wind > 40: raise ValueError(f"wind too strong: {wind}")',
         'In the loop: try: print(set_sail(wind)) / except ValueError as e: print(f"Stay ashore: {e}")'],

  [17,'Ridge Python'],[24,'Jungle Python'],[30,'Archive Adder'],[36,'Loom Serpent'],[42,'Storm Serpent'],
  [48,'Ancient Python'],[54,'Golden Python']];
function petStage(n){let s=PET_STAGES[0];for(const st of PET_STAGES)if(n>=st[0])s=st;return s;}
function petNextStage(n){for(const st of PET_STAGES)if(st[0]>n)return st;return null;}
function petSVG(n){
  const W=210,H=64,cy=36;
  if(n===0){
    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A speckled snake egg in a nest">
      <path d="M ${W/2-26} ${cy+14} Q ${W/2} ${cy+26} ${W/2+26} ${cy+14}" stroke="#1e3a30" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="${W/2}" cy="${cy-4}" rx="15" ry="19" fill="#d8cfae" stroke="#b98a2e" stroke-width="1.5"/>
      <circle cx="${W/2-5}" cy="${cy-11}" r="2" fill="#b98a2e"/>
      <circle cx="${W/2+6}" cy="${cy-2}" r="2.4" fill="#b98a2e"/>
      <circle cx="${W/2-3}" cy="${cy+5}" r="1.5" fill="#b98a2e"/>
    </svg>`;
  }
  const stageIdx=PET_STAGES.indexOf(petStage(n));
  const golden=n>=PET_STAGES[PET_STAGES.length-1][0];
  const segs=Math.min(n,24);
  const len=Math.min(46+segs*6.5,W-26);
  const amp=6+stageIdx*0.75;
  const waves=1.2+segs*0.11;
  const x0=8;
  const pts=[];
  let hx=x0,hy=cy;
  for(let i=0;i<=60;i++){
    const t=i/60;
    hx=x0+len*t;
    hy=cy+Math.sin(t*Math.PI*2*waves)*amp*(0.35+0.65*t);
    pts.push(hx.toFixed(1)+','+hy.toFixed(1));
  }
  const col=golden?'#f2b33d':'#4fbf8b';
  const sw=(3+stageIdx*0.45).toFixed(1);
  const hr=(4.5+stageIdx*0.45).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your snake companion, ${petStage(n)[1]}, ${segs} segments long">
    <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="${hr}" fill="${col}"/>
    <circle cx="${(hx+1.5).toFixed(1)}" cy="${(hy-1.8).toFixed(1)}" r="1.3" fill="#0c1a16"/>
    <path d="M ${(hx+Number(hr)).toFixed(1)} ${hy.toFixed(1)} l 5 0 m 0 0 l 3 -2 m -3 2 l 3 2" stroke="#e0645c" stroke-width="1.2" fill="none"/>
    ${golden?`<circle cx="${(hx-10).toFixed(1)}" cy="${(hy-12).toFixed(1)}" r="1.5" fill="#ffe9b3"/><circle cx="${(hx-22).toFixed(1)}" cy="${(hy+8).toFixed(1)}" r="1.2" fill="#ffe9b3"/>`:''}
  </svg>`;
}

let audioCtx=null;
function chime(evolved){
  if(state.muted)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  try{
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const t0=audioCtx.currentTime+0.01;
    // C5 E5 G5 — a rising major triad; an extra octave C6 when the pet evolves
    const notes=evolved?[523.25,659.25,783.99,1046.5]:[523.25,659.25,783.99];
    notes.forEach((f,i)=>{
      const t=t0+i*0.085;
      const osc=audioCtx.createOscillator();
      const gain=audioCtx.createGain();
      osc.type='triangle';
      osc.frequency.setValueAtTime(f,t);
      gain.gain.setValueAtTime(0.0001,t);
      gain.gain.exponentialRampToValueAtTime(0.16,t+0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t+0.42);
    });
  }catch(e){/* audio is a nicety — never break the game over it */}
}

function editorSetup(ta){
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){
      e.preventDefault();
      const s=ta.selectionStart,epos=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(epos);
      ta.selectionStart=ta.selectionEnd=s+4;
    }
    if(e.key==='Enter'){
      const s=ta.selectionStart;
      const before=ta.value.slice(0,s);
      const lineStart=before.lastIndexOf('\n')+1;
      const line=before.slice(lineStart);
      let indent=line.match(/^ */)[0];
      if(line.trimEnd().endsWith(':'))indent+='    ';
      if(indent){
        e.preventDefault();
        ta.value=before+'\n'+indent+ta.value.slice(ta.selectionEnd);
        ta.selectionStart=ta.selectionEnd=s+1+indent.length;
      }
    }
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
      e.preventDefault();
      const btn=document.querySelector('button.run[data-runs]');
      if(btn)btn.click();
    }
  });
}

function normalize(s){

function runLevel(lv,ta){
  const code=ta.value;
  const res=runPython(code);
  showConsole(res);
  const banner=$('#banner');
  banner.className='banner';
  // requirement checks first (with code that at least ran)
  if(!res.error){
    for(const r of lv.require){
      if(!r.re.test(code)){
        banner.className='banner lose show';
        banner.innerHTML=`<span class="headline">NOT QUITE —</span><span>${escHtml(r.msg)}</span>`;
        bumpAttempts(lv);
        return;
      }
    }
  }
  const got=normalize(res.out.join('\n'));
  const want=normalize(lv.expected);
  if(!res.error && got===want){
    const first=!isSolved(lv.id);
    let evolved=null;
    if(first){
      const before=petStage(state.solved.length)[1];
      state.solved.push(lv.id);
      state.xp+=lv.xp;
      const after=petStage(state.solved.length)[1];
      if(after!==before)evolved=after;
      save();renderHUD();renderMap();
    }
    chime(!!evolved);
    const idx=LEVELS.indexOf(lv);
    const next=LEVELS[idx+1];
    banner.className='banner win show';
    banner.innerHTML=`<span class="headline">✓ OUTPUT MATCHES${first?` — +${lv.xp} XP`:''}</span>
      <span>${evolved?`${escHtml(state.petName)} ${evolved==='Hatchling'?'hatched into a':'evolved into a'} <b style="color:var(--leaf)">${evolved}</b>! `:''}${first&&rankJustChanged()?`New rank: <b style="color:var(--gold)">${rankFor(state.xp)}</b>`:''}</span>
      ${next?`<button class="next" id="nextbtn">NEXT: ${escHtml(next.title.toUpperCase())} ▸</button>`
            :`<button class="next" id="nextbtn">FINISH EXPEDITION ▸</button>`}`;
    $('#nextbtn').addEventListener('click',()=>{
      state.current=next?next.id:'finish';save();render();
      window.scrollTo({top:0});
    });
  } else if(!res.error){
    banner.className='banner lose show';
    banner.innerHTML=`<span class="headline">CLOSE —</span><span>the code ran, but the output doesn't match yet.</span>
      <span style="flex-basis:100%;font-family:var(--mono);font-size:.8rem" class="exp">expected:\n${escHtml(want)}\n\ngot:\n${escHtml(got)||'(nothing)'}</span>`;
    bumpAttempts(lv);
  } else {
    bumpAttempts(lv);
  }
}
let prevRank=null;
function rankJustChanged(){
  const r=rankFor(state.xp);
  const changed=prevRank!==null&&r!==prevRank;
  prevRank=r;
  return changed;
}
function bumpAttempts(lv){
  attempts[lv.id]=(attempts[lv.id]||0)+1;
  if(attempts[lv.id]>=3)$('#solbtn').style.display='';
}

function renderPlayground(){
  const draft=state.drafts['playground'];
  mainEl.innerHTML=`
    <p class="eyebrow">Free Roam</p>
    <h1 class="title">The Playground</h1>
    <div class="brief"><p>No objective, no checker — just you and the interpreter. Everything from
    the expedition works here: variables, f-strings, <code>if</code>/<code>elif</code>/<code>else</code>,
    loops, lists, dictionaries, tuples, comprehensions, functions, <code>try</code>/<code>except</code>, and classes.</p></div>
    ${benchHTML(draft!==undefined?draft:'# The island is yours.\nfor i in range(3):\n    print(f"echo {i}")\n')}`;
  const ta=$('#code');editorSetup(ta);
  ta.addEventListener('input',()=>{state.drafts['playground']=ta.value;save();});
  $('#resetbtn').addEventListener('click',()=>{
    ta.value='';delete state.drafts['playground'];save();
    $('#console').innerHTML='<span class="muted"># output appears here — press RUN</span>';
  });
  $('#runbtn').addEventListener('click',()=>{
    showConsole(runPython(ta.value));
  });
}

function render(){
  renderHUD();renderMap();
  prevRank=rankFor(state.xp);
  if(state.current==='playground')return renderPlayground();
  // players who finished before new chapters existed: send them back to the map
  if(state.current==='finish'&&state.solved.length<LEVELS.length)state.current=null;
  if(state.current==='finish'||(state.solved.length===LEVELS.length&&state.current===null))return renderFinish();
  const lv=LEVELS.find(l=>l.id===state.current);
  if(lv&&isUnlocked(LEVELS.indexOf(lv)))return renderLevel(lv);
  renderHero();
}
render();
</script>
